# wayfinder #60 — GEO relaxation LJ non-periodic row, FIRE optimizer.
# Canonical CPU reference config (no CI case in kUPS-CI; methodology per #59).
# Starting structure: argon4_vac.xyz (4-atom Ar cluster, VacuumCell, pbc="F F F"
# via the #105 store_tags fallback). Positions-only relaxation (optimize_cell
# false) — no deformation frame (#96): no eig path.
# FIRE chain prepends scale(-1): RelaxationPropagator passes raw grad
# (relaxation/propagator.py:109) while ScaleByFire expects force F = -grad.
inp_files:
  - ../host/argon4_vac.xyz

run:
  out_file: ../../geo_relax_fire_lj_argon_vac_ref.h5
  max_steps: 1000
  seed: 42
  force_tolerance: 0.01
  optimizer:
    - transform: scale
      step_size: -1
    - transform: scale_by_fire
    - transform: clip_by_global_norm
      max_norm: 10.0
    - transform: max_step_size
      max_step_size: 0.1
  optimize_cell: false

potential:
  backend: lj
  cutoff: 10.0
  mixing_rule: lorentz_berthelot
  parameters:
    Ar: [3.405, 0.01032356174398622]