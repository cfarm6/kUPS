# wayfinder #50 — MD NVE LJ argon, non-periodic (VacuumCell) row.
# 4-atom Ar cluster from argon4_vac.xyz (xyz header pbc="F F F", cell 25^3).
# Same physics as md_nve_lj_argon.yaml (verlet, dt 0.1, T=100, cutoff 10)
# minus periodicity: vacuum cell, no wrap, no tail correction.
inp_files:
  - ../host/argon4_vac.xyz

run:
  out_file: ../../md_nve_lj_argon_vac_ref.h5
  num_warmup_steps: 10_000
  num_steps: 20_000
  seed: 42

md:
  temperature: 100.0
  time_step: 0.1
  friction_coefficient: 0.0
  thermostat_time_constant: 1.0e10
  target_pressure: 1.0
  pressure_coupling_time: 1.0e10
  compressibility: 4.5e-5
  minimum_scale_factor: 1.0
  integrator: verlet

potential:
  backend: lj
  cutoff: 10.0
  mixing_rule: lorentz_berthelot
  parameters:
    Ar: [3.405, 0.01032356174398622]
