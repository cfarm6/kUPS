# wayfinder #59 — GEO relaxation LJ 3D periodic row, FIRE optimizer.
# Canonical CPU reference config (no CI case in kUPS-CI; methodology per #59).
# Starting structure: canonical argon_fcc.cif (256 atoms, thermal noise —
# nonzero forces for the optimizer). Positions-only relaxation (optimize_cell
# false); cell relaxation is a row-scope option for the human to confirm.
# FIRE chain prepends scale(-1): RelaxationPropagator passes raw grad
# (relaxation/propagator.py:109) while ScaleByFire expects force F = -grad.
inp_files:
  - ../host/argon_fcc.cif

run:
  out_file: ../../geo_relax_fire_lj_argon_ref.h5
  max_steps: 1000
  seed: 42
  force_tolerance: 0.01
  optimizer:
    - transform: scale
      step_size: -1
    - transform: scale_by_fire
    - transform: clip_by_global_norm
      max_norm: 10.0
    - transform: max_step_size
      max_step_size: 0.1
  optimize_cell: false

potential:
  backend: lj
  cutoff: 10.0
  mixing_rule: lorentz_berthelot
  parameters:
    Ar: [3.405, 0.01032356174398622]
