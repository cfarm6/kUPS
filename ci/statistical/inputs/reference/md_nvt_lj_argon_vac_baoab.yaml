# wayfinder #51 — MD NVT BAOAB LJ argon, non-periodic (VacuumCell) row.
# Same physics as md_nvt_lj_argon.yaml (argon_fcc 256 atoms, seed 42,
# dt 2.0, T=100, friction 0.01, tau=100, cutoff 10) minus periodicity:
# 4-Ar cluster from argon4_vac.xyz (xyz header pbc="F F F", cell 25^3),
# vacuum cell, no wrap, no tail correction. BAOAB Langevin thermostat.
inp_files:
  - ../host/argon4_vac.xyz

run:
  out_file: ../../md_nvt_lj_argon_vac_baoab_ref.h5
  num_warmup_steps: 10_000
  num_steps: 20_000
  seed: 42

md:
  temperature: 100.0
  time_step: 2.0
  friction_coefficient: 0.01
  thermostat_time_constant: 100.0
  target_pressure: 1.0
  pressure_coupling_time: 1.0e10
  compressibility: 4.5e-5
  minimum_scale_factor: 1.0
  integrator: baoab_langevin
  initialize_momenta: true

potential:
  backend: lj
  cutoff: 10.0
  mixing_rule: lorentz_berthelot
  parameters:
    Ar: [3.405, 0.01032356174398622]
