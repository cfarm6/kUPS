# wayfinder #47 — MD NVT CSVR LJ argon, CPU reference row.
# Same physics as md_nvt_lj_argon.yaml (argon_fcc 256 atoms, seed 42,
# dt 2.0, T=100, tau=100, cutoff 10) with the CSVR stochastic velocity
# rescaling thermostat instead of BAOAB Langevin. friction_coefficient is
# unused by csvr but required by the config schema.
inp_files:
  - ../host/argon_fcc.cif

run:
  out_file: ../../md_nvt_csvr_lj_argon_ref.h5
  num_warmup_steps: 10_000
  num_steps: 20_000
  seed: 42

md:
  temperature: 100.0
  time_step: 2.0
  friction_coefficient: 0.01
  thermostat_time_constant: 100.0
  target_pressure: 1.0
  pressure_coupling_time: 1.0e10
  compressibility: 4.5e-5
  minimum_scale_factor: 1.0
  integrator: csvr
  initialize_momenta: true

potential:
  backend: lj
  cutoff: 10.0
  mixing_rule: lorentz_berthelot
  parameters:
    Ar: [3.405, 0.01032356174398622]
