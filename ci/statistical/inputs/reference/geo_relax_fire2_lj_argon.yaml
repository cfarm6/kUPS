# wayfinder #59 — GEO relaxation LJ 3D periodic row, FIRE 2.0 optimizer.
# Same physics as geo_relax_fire_lj_argon.yaml; scale_by_fire2 with built-in
# dmax. CPU reference config (no CI case in kUPS-CI).
inp_files:
  - ../host/argon_fcc.cif

run:
  out_file: ../../geo_relax_fire2_lj_argon_ref.h5
  max_steps: 1000
  seed: 42
  force_tolerance: 0.01
  optimizer:
    - transform: scale
      step_size: -1
    - transform: scale_by_fire2
    - transform: clip_by_global_norm
      max_norm: 10.0
    - transform: max_step_size
      max_step_size: 0.1
  optimize_cell: false

potential:
  backend: lj
  cutoff: 10.0
  mixing_rule: lorentz_berthelot
  parameters:
    Ar: [3.405, 0.01032356174398622]
